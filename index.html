<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TESTS</title>
<style>
  :root {
    --paper: #101613; --card: #1a2420; --card-border: #2a3a33;
    --teal: #2bb3a0; --text: #f2f5f3; --muted: #8fa79d;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 20% -10%, #1c332c 0%, var(--paper) 55%);
    color: var(--text); margin: 0; min-height: 100vh; padding: 40px 18px 48px;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { max-width: 420px; width: 100%; }
  .eyebrow { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--teal); margin: 0 0 6px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; text-align: center; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; text-align: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  a.card {
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    height: 92px; padding: 16px; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; color: var(--text); font-size: 16px; font-weight: 600;
    text-decoration: none; transition: transform 0.12s, border-color 0.12s;
  }
  a.card:active { transform: scale(0.97); }
  a.card .icon { font-size: 22px; margin-bottom: 6px; }
  .footer-note { margin-top: 30px; font-size: 12px; color: #56685f; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Cognition Test Tracker</p>
  <h1>Pranay's Dashboard</h1>
  <p class="sub">Welcome, Pranay &mdash; here's your progress.</p>
  <div class="grid">
    <a class="card" href="physics.html"><span class="icon">&#9889;</span>Physics</a>
    <a class="card" href="chemistry.html"><span class="icon">&#129514;</span>Chemistry</a>
    <a class="card" href="maths.html"><span class="icon">&#8721;</span>Maths</a>
    <a class="card" href="combine.html"><span class="icon">&#128218;</span>Combine</a>
  </div>
  <p class="footer-note">Cognition Test Tracker</p>
</div>
</body>
</html>
