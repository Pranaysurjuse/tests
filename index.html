<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognition Tracker — Access</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #050505; font-family: 'Courier New', monospace; color: #ff3b3b;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .grid-bg {
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,59,59,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,59,59,0.08) 1px, transparent 1px);
    background-size: 32px 32px; animation: drift 20s linear infinite;
  }
  @keyframes drift { from { background-position: 0 0; } to { background-position: 320px 320px; } }
  .scanline { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,59,59,0.03) 0px, transparent 1px, transparent 3px); }

  .panel {
    position: relative; z-index: 2; width: 360px; max-width: 90vw;
    border: 1px solid #ff3b3b55; background: rgba(10,0,0,0.6); padding: 32px 28px;
    box-shadow: 0 0 40px rgba(255,59,59,0.15), inset 0 0 40px rgba(255,59,59,0.05);
    transition: box-shadow 0.6s ease, border-color 0.6s ease;
    overflow: hidden;
  }
  .corner { position: absolute; width: 14px; height: 14px; border: 2px solid #ff3b3b; opacity: 0.8; transition: all 0.4s; }
  .panel.error-shake { animation: shake 0.4s ease; }
  @keyframes shake {
    10%,90% { transform: translateX(-2px); }
    20%,80% { transform: translateX(3px); }
    30%,50%,70% { transform: translateX(-5px); }
    40%,60% { transform: translateX(5px); }
  }
  .panel.welcome-active { animation: panelGlow 1.6s ease-out forwards; }
  .panel.welcome-active .corner { width: 20px; height: 20px; opacity: 1; box-shadow: 0 0 12px #ff3b3b; }
  @keyframes panelGlow {
    0% { box-shadow: 0 0 40px rgba(255,59,59,0.15), inset 0 0 40px rgba(255,59,59,0.05); }
    30% { box-shadow: 0 0 70px rgba(255,59,59,0.5), inset 0 0 60px rgba(255,59,59,0.15); }
    100% { box-shadow: 0 0 40px rgba(255,59,59,0.15), inset 0 0 40px rgba(255,59,59,0.05); }
  }
  .tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
  .tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
  .bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
  .br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

  .logo { text-align: center; font-size: 11px; letter-spacing: 4px; color: #ff3b3b; margin-bottom: 4px; text-shadow: 0 0 8px #ff3b3b; }
  .title { text-align: center; font-size: 20px; letter-spacing: 2px; margin-bottom: 24px; color: #ffdddd; min-height: 24px; transition: opacity 0.3s ease; }

  .stage { display: none; opacity: 0; transform: translateY(10px); }
  .stage.active { display: block; animation: stageIn 0.45s cubic-bezier(.2,.9,.3,1) forwards; }
  .stage.exiting { display: block; animation: stageOut 0.22s ease forwards; }
  @keyframes stageIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes stageOut { to { opacity: 0; transform: translateY(-10px); } }

  .field-label { font-size: 10px; letter-spacing: 2px; color: #ff3b3b99; margin-bottom: 6px; }
  input[type=password] {
    width: 100%; background: #150000; border: 1px solid #ff3b3b55; color: #ffdddd;
    font-family: 'Courier New', monospace; font-size: 15px; letter-spacing: 4px;
    padding: 10px 12px; outline: none; margin-bottom: 6px; transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  input[type=password]:focus { border-color: #ff3b3b; box-shadow: 0 0 10px rgba(255,59,59,0.4); }
  .err { font-size: 11px; color: #ff3b3b; min-height: 14px; margin-bottom: 10px; opacity: 0; transition: opacity 0.25s ease; }
  .err.show { opacity: 1; }

  button.action {
    width: 100%; background: transparent; border: 1px solid #ff3b3b; color: #ff3b3b;
    font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 3px;
    padding: 11px; cursor: pointer; text-transform: uppercase; transition: all 0.15s; margin-bottom: 10px;
  }
  button.action:hover { background: #ff3b3b; color: #050505; box-shadow: 0 0 16px rgba(255,59,59,0.5); }
  button.action:active { transform: scale(0.96); }

  .boot-log { font-size: 11px; line-height: 1.9; color: #ff3b3b; min-height: 140px; position: relative; z-index: 2; }
  .boot-log div { opacity: 0; transform: translateX(-8px); animation: lineIn 0.2s ease forwards; }
  @keyframes lineIn { to { opacity: 1; transform: translateX(0); } }
  .boot-log .ok { color: #4dff8f; }
  .boot-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #ff3b3b; margin-right: 6px; animation: dotPulse 0.8s ease-in-out infinite; }
  @keyframes dotPulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  .type-cursor { display: inline-block; width: 6px; height: 12px; background: #ff3b3b; margin-left: 2px; animation: blink 0.9s step-end infinite; vertical-align: middle; }
  @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

  .widget-graph {
    position: absolute; bottom: 10px; right: 10px; width: 90px; height: 34px;
    opacity: 0.35; z-index: 1; pointer-events: none;
  }
  .widget-graph path { fill: none; stroke: #ff3b3b; stroke-width: 1; }
  .widget-bars { position: absolute; top: 10px; right: 10px; display: flex; gap: 2px; align-items: flex-end; height: 20px; opacity: 0.4; z-index: 1; }
  .widget-bars span { width: 3px; background: #ff3b3b; animation: barMove 1.2s ease-in-out infinite; }
  @keyframes barMove { 0%,100% { height: 20%; } 50% { height: 90%; } }

  .welcome-wrap { text-align: center; position: relative; padding: 20px 0; }
  .welcome-ring {
    position: absolute; left: 50%; top: 50%; width: 40px; height: 40px;
    border: 1px solid #ff3b3b; border-radius: 50%; transform: translate(-50%,-50%);
    opacity: 0; animation: ringPulse 1.6s ease-out forwards 0.1s;
  }
  .welcome-ring.r2 { animation-delay: 0.35s; }
  .welcome-ring.r3 { animation-delay: 0.6s; }
  @keyframes ringPulse {
    0% { width: 20px; height: 20px; opacity: 0.9; border-width: 2px; }
    100% { width: 340px; height: 340px; opacity: 0; border-width: 1px; }
  }
  .welcome-txt {
    position: relative; font-size: 26px; letter-spacing: 3px; color: #ffdddd; text-shadow: 0 0 16px #ff3b3b;
    opacity: 0; animation: welcomeIn 0.6s ease forwards 0.5s, flicker 2.2s linear forwards 0.5s;
  }
  @keyframes welcomeIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes flicker {
    0% { opacity: 0; } 4% { opacity: 1; } 6% { opacity: 0.3; } 8% { opacity: 1; }
    10% { opacity: 0.5; } 12% { opacity: 1; } 100% { opacity: 1; }
  }
  .welcome-sub { position: relative; margin-top: 10px; font-size: 11px; letter-spacing: 2px; color: #ff3b3b99; opacity: 0; animation: welcomeIn 1s ease forwards 1.1s; }
  .welcome-bar { position: relative; width: 100%; height: 2px; background: #ff3b3b22; margin-top: 20px; overflow: hidden; }
  .welcome-bar::after {
    content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 0%;
    background: #ff3b3b; box-shadow: 0 0 8px #ff3b3b; animation: barFill 1.7s ease forwards 0.7s;
  }
  @keyframes barFill { to { width: 100%; } }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanline"></div>

<div class="panel" id="mainPanel">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

  <div class="logo">COGNITION TEST TRACKER</div>
  <div class="title" id="titleText">RESTRICTED ACCESS</div>

  <div class="stage active" id="stagePassword">
    <div class="field-label">ENTER ACCESS CODE</div>
    <input type="password" id="pwInput" maxlength="12" autocomplete="off" placeholder="••••••">
    <div class="err" id="pwErr"></div>
    <button class="action" onclick="checkPassword()">Authenticate</button>
  </div>

  <div class="stage" id="stageBoot">
    <div class="boot-log" id="bootLog"></div>
    <div class="widget-bars">
      <span style="animation-delay:0s"></span><span style="animation-delay:0.15s"></span><span style="animation-delay:0.3s"></span><span style="animation-delay:0.1s"></span><span style="animation-delay:0.25s"></span>
    </div>
    <svg class="widget-graph" viewBox="0 0 90 34" preserveAspectRatio="none">
      <path id="graphPath" d="M0,20 L10,18 L20,22 L30,10 L40,16 L50,8 L60,14 L70,6 L80,12 L90,4" />
    </svg>
  </div>

  <div class="stage" id="stageWelcome">
    <div class="welcome-wrap">
      <div class="welcome-ring"></div>
      <div class="welcome-ring r2"></div>
      <div class="welcome-ring r3"></div>
      <div class="welcome-txt">WELCOME, PRANAY</div>
      <div class="welcome-sub">SESSION AUTHENTICATED &middot; LOADING DASHBOARD</div>
      <div class="welcome-bar"></div>
    </div>
  </div>
</div>

<script>
const PASSWORD = 'jee2028';
let audioCtx = null;

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, duration, type, vol) {
  try {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = vol !== undefined ? vol : 0.06;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}
function noiseClick(duration, vol) {
  try {
    const ctx = getCtx();
    const bufferSize = ctx.sampleRate * duration;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 3000;
    const gain = ctx.createGain();
    gain.gain.value = vol !== undefined ? vol : 0.05;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    src.start();
  } catch(e) {}
}
const sfx = {
  key: () => noiseClick(0.02, 0.05),
  type: () => noiseClick(0.012, 0.035),
  error: () => { beep(160, 0.2, 'square', 0.06); setTimeout(() => beep(120, 0.25, 'square', 0.06), 140); },
  success: () => { beep(720, 0.05, 'sine', 0.05); setTimeout(() => beep(1080, 0.09, 'sine', 0.05), 70); setTimeout(() => beep(1440, 0.14, 'sine', 0.04), 150); },
  boot: () => noiseClick(0.015, 0.03),
  welcome: () => { beep(587, 0.12, 'sine', 0.05); setTimeout(() => beep(880, 0.12, 'sine', 0.05), 110); setTimeout(() => beep(1175, 0.25, 'sine', 0.05), 230); }
};

document.getElementById('pwInput').addEventListener('input', sfx.key);

function show(id) {
  const current = document.querySelector('.stage.active');
  const next = document.getElementById(id);
  if (current && current !== next) {
    current.classList.remove('active');
    current.classList.add('exiting');
    setTimeout(() => {
      current.classList.remove('exiting');
      next.classList.add('active');
    }, 200);
  } else {
    next.classList.add('active');
  }
}

function checkPassword() {
  const val = document.getElementById('pwInput').value;
  const err = document.getElementById('pwErr');
  const panel = document.getElementById('mainPanel');
  if (val.trim() === '') {
    err.textContent = 'ENTER A CODE';
    err.classList.add('show');
    sfx.error();
    panel.classList.remove('error-shake'); void panel.offsetWidth; panel.classList.add('error-shake');
    return;
  }
  if (val !== PASSWORD) {
    err.textContent = 'ACCESS DENIED — INCORRECT CODE';
    err.classList.add('show');
    sfx.error();
    panel.classList.remove('error-shake'); void panel.offsetWidth; panel.classList.add('error-shake');
    document.getElementById('pwInput').value = '';
    return;
  }
  err.classList.remove('show');
  sfx.success();
  runBoot();
}

function typeLine(el, text, prefix, cssClass, onDone) {
  el.innerHTML = '';
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'type-cursor';
  el.innerHTML = prefix;
  el.appendChild(cursor);
  const interval = setInterval(() => {
    if (i < text.length) {
      cursor.insertAdjacentText('beforebegin', text[i]);
      sfx.type();
      i++;
    } else {
      clearInterval(interval);
      cursor.remove();
      if (cssClass) el.classList.add(cssClass);
      if (onDone) onDone();
    }
  }, 32);
}

function runBoot() {
  document.getElementById('titleText').style.opacity = '0';
  setTimeout(() => { document.getElementById('titleText').textContent = 'SYSTEM BOOT'; document.getElementById('titleText').style.opacity = '1'; }, 300);
  show('stageBoot');
  const lines = [
    'Initializing tracker core...',
    'Loading Physics module...',
    'Loading Chemistry module...',
    'Loading Maths module...',
    'Syncing test history...',
    'All systems nominal.'
  ];
  const log = document.getElementById('bootLog');
  log.innerHTML = '';

  function runLine(i) {
    if (i >= lines.length) {
      setTimeout(() => {
        sfx.welcome();
        document.getElementById('titleText').style.opacity = '0';
        setTimeout(() => { document.getElementById('titleText').textContent = ''; }, 300);
        show('stageWelcome');
        document.getElementById('mainPanel').classList.add('welcome-active');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
      }, 500);
      return;
    }
    const div = document.createElement('div');
    log.appendChild(div);
    const isLast = i === lines.length - 1;
    const prefix = isLast ? '<span class="ok">[OK]</span> ' : '&gt; ';
    typeLine(div, lines[i], prefix, isLast ? 'ok-line' : '', () => {
      setTimeout(() => runLine(i + 1), 280);
    });
  }
  setTimeout(() => runLine(0), 400);
}

document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
</script>
</body>
</html>
