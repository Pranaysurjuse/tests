<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Maths</title>
<style>*{box-sizing:border-box}html,body{margin:0}
:root{--a:#ef8b7c;--t:#f4f1ea;--m:#8d8a84;--card:rgba(255,255,255,.045);--bd:rgba(255,255,255,.09)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b0708;color:var(--t);min-height:100vh;min-height:100dvh;padding:22px 16px 50px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.deco svg{position:absolute}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 380px at 85% -5%,rgba(239,139,124,.18),transparent 70%),radial-gradient(500px 340px at -10% 105%,rgba(239,139,124,.08),transparent 70%)}
.wrap{position:relative;max-width:460px;margin:0 auto}
.back{display:inline-flex;gap:6px;color:var(--t);text-decoration:none;font-size:12.5px;padding:8px 14px;background:var(--card);border:1px solid var(--bd);margin-bottom:22px}
.back:active{transform:scale(.96)}
.eyebrow{display:flex;align-items:center;gap:8px;font:600 11px 'Courier New',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--a);margin:0 0 10px}
h1{font-size:30px;line-height:1.1;margin:0 0 8px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--m);font-size:14px;line-height:1.5;margin:0 0 24px}
.fade{opacity:0;transform:translateY(12px);animation:u .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes u{to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:118px;padding:16px;background:var(--card);border:1px solid var(--bd);color:var(--t);text-decoration:none;transition:.25s}
.tile:hover{border-color:rgba(239,139,124,.55);box-shadow:0 10px 30px -12px rgba(239,139,124,.4)}
.tile:active{transform:scale(.97)}
.ic{width:38px;height:38px;display:grid;place-items:center;background:rgba(239,139,124,.14);color:var(--a)}
.ic svg{width:20px;height:20px}
.tile b{font-size:16px;margin-top:14px;display:block}
.tile.wide{grid-column:1/-1;min-height:96px;background:linear-gradient(135deg,rgba(239,139,124,.18),rgba(239,139,124,.04));border-color:rgba(239,139,124,.4)}
.foot{margin-top:30px;text-align:center;font-size:11.5px;color:#5c5a56}
.back,.tile{border-radius:4px}.ic{border-radius:3px}.tile{border:1px dashed rgba(239,139,124,.45)}
h1{font-family:Georgia,'Times New Roman',serif;font-style:italic}
.eyebrow::before{content:"\2211";font-size:14px}
.deco svg{bottom:-4%;right:-6%;width:90vmin;height:60vmin;opacity:.5}
.papers{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(239,139,124,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(239,139,124,.06) 1px,transparent 1px);background-size:32px 32px}
.curve{stroke-dasharray:900;stroke-dashoffset:900;animation:dr 4s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}</style></head>
<body><div class="glow"></div><div class="papers"></div><div class="deco"><svg viewBox="0 0 400 200" fill="none" stroke="#ef8b7c" stroke-width="2"><path class="curve" d="M0 100 C 50 0, 100 0, 150 100 S 250 200, 300 100 S 370 20, 400 90"/><path class="curve" style="animation-delay:.6s;opacity:.5" d="M0 140 C 60 60, 120 60, 180 140 S 300 220, 400 130"/><line x1="0" y1="100" x2="400" y2="100" stroke-opacity=".3" stroke-dasharray="4 6"/></svg></div><div class="wrap">

<a class="tile fade" style="animation-delay:0.24s" href="maths/august/index.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></div><b>August</b></a>

<a class="tile wide fade" style="animation-delay:.4s" href="maths/overview/index.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div><b>All months</b></a>
</div>
<p class="foot">Cognition Test Tracker &middot; Maths</p>
