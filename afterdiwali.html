<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After Diwali - New Start</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(circle at 20% 0%,#16101f 0%,#000 45%),#000;color:#f2f5f3;padding:24px 18px 80px;min-height:100vh}
.wrap{max-width:860px;margin:0 auto}
.home-pill{display:inline-flex;background:#1a2420;border:1px solid #2a3a33;color:#f2f5f3;font-size:12.5px;padding:7px 12px;border-radius:20px;text-decoration:none;margin-bottom:14px}
.eyebrow{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a78bfa;margin:0 0 6px;font-weight:700}
h1{font-size:28px;margin:0 0 4px;font-weight:800}
.sub{color:#8a8a95;font-size:14px;margin:0 0 24px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
@media(max-width:520px){.kpis{grid-template-columns:1fr 1fr}}
.kpi,.test{background:#141414;border:1px solid #2a2a2a;border-radius:14px;padding:14px}
.kl{font-size:11.5px;color:#949494;margin:0 0 6px}
.kv{font-family:'Courier New',monospace;font-size:22px;font-weight:700;margin:0}
.kv small{font-size:12px;color:#949494;font-weight:400}
.label{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#a78bfa;border-bottom:1px solid #2a2a2a;padding-bottom:6px;margin:26px 0 14px}
.test{margin-bottom:12px}
.th{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.tn{font-weight:700;font-size:16px}
.td{font-family:'Courier New',monospace;font-size:12px;color:#949494}
.tt{font-family:'Courier New',monospace;font-size:18px;font-weight:700}
.sr{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px}
.sn{width:78px;flex-shrink:0}
.bar{flex:1;height:10px;background:#232323;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.sv{width:84px;text-align:right;font-family:'Courier New',monospace;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}.chip{font-family:'Courier New',monospace;font-size:12px;padding:6px 13px;border-radius:16px;border:1px solid #2a2a2a;color:#8a8a8a;text-decoration:none}.chip.on{color:#c9a4ff;border-color:#7c5cf9;background:#1c1530}
.empty{text-align:center;padding:48px 20px;border:1px dashed #7c5cf9;border-radius:18px;color:#c9a4ff;background:#120e1f}
.empty b{display:block;font-size:18px;margin-bottom:6px;color:#f2f5f3}
.empty span{font-size:13.5px;color:#8a8a95}
.spark{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
.spark div{flex:1;background:#7c5cf9;border-radius:5px 5px 0 0;min-height:3px;position:relative}
.spark em{position:absolute;top:-16px;left:0;right:0;text-align:center;font-style:normal;font-size:10.5px;font-family:'Courier New',monospace;color:#c9a4ff}
</style>
</head>
<body>
<div class="wrap">
<a class="home-pill" id="back" href="dashboard.html">&larr; Home</a>
<p class="eyebrow">New start</p>
<h1 id="ttl">After Diwali</h1>
<p class="sub">Fresh page, fresh tests. Only tests after Diwali show up here.</p>
<div class="chips" id="chips"></div>
<div id="app"></div>
</div>
<script>
// ADD NEW TESTS HERE (newest last). Subjects are optional, include only the ones in that test.
// Adv test (one total): {date:"2026-11-22", name:"Adv Test 1", subjects:{Adv:{score:150,max:229}}}
// Example:
// {date:"2026-11-16", name:"Test 1", subjects:{Physics:{score:60,max:100}, Chemistry:{score:70,max:100}, Maths:{score:40,max:100}}}
const TESTS = [
  {date:"2026-11-16", name:"Mains Test 1", subjects:{Physics:{score:45,max:100}, Chemistry:{score:40,max:100}, Maths:{score:12,max:100}}}
];

const SUBJ=new URLSearchParams(location.search).get("subject");
const VIEW=SUBJ?TESTS.filter(t=>t.subjects[SUBJ]).map(t=>({...t,subjects:{[SUBJ]:t.subjects[SUBJ]}})):TESTS;
if(SUBJ){document.getElementById("ttl").textContent=SUBJ+" \u00b7 After Diwali";const b=document.getElementById("back");b.href=SUBJ.toLowerCase()+".html";b.innerHTML="&larr; "+SUBJ}
document.getElementById("chips").innerHTML=[["All",""],["Physics","Physics"],["Chemistry","Chemistry"],["Maths","Maths"],["Adv","Adv"]].map(([n,v])=>`<a class="chip${(SUBJ||"")===v?" on":""}" href="afterdiwali.html${v?"?subject="+v:""}">${n}</a>`).join("");
const COL={Physics:'#6fcf97',Chemistry:'#3b9dff',Maths:'#ef8b7c',Adv:'#f5c451'};
const fmt=d=>new Date(d).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const app=document.getElementById("app");
const tot=t=>{let s=0,m=0;for(const k in t.subjects){s+=t.subjects[k].score;m+=t.subjects[k].max}return{s,m,p:m?s/m*100:0}};

if(!VIEW.length){
  app.innerHTML=`<div class="empty"><b>No tests yet</b><span>Your first test after Diwali (16 Nov) will show up here once the marks are added.</span></div>`;
}else{
  const T=VIEW.map(t=>({...t,...tot(t)}));
  const best=T.reduce((a,b)=>b.p>a.p?b:a),last=T[T.length-1];
  const avg=T.reduce((a,b)=>a+b.p,0)/T.length;
  let h=`<div class="kpis">
   <div class="kpi"><p class="kl">Tests given</p><p class="kv">${T.length}</p></div>
   <div class="kpi"><p class="kl">Latest</p><p class="kv">${last.s}<small>/${last.m}</small></p></div>
   <div class="kpi"><p class="kl">Average</p><p class="kv">${avg.toFixed(0)}<small>%</small></p></div>
   <div class="kpi"><p class="kl">Best</p><p class="kv">${best.p.toFixed(0)}<small>% &middot; ${best.name}</small></p></div></div>`;
  if(T.length>1) h+=`<div class="label">Trend</div><div class="spark">${T.map(t=>`<div style="height:${Math.max(t.p,3)}%"><em>${t.p.toFixed(0)}</em></div>`).join("")}</div>`;
  h+=`<div class="label">Tests</div>`+T.slice().reverse().map(t=>`<div class="test">
   <div class="th"><div><div class="tn">${t.name}</div><div class="td">${fmt(t.date)}</div></div><div class="tt">${t.s}/${t.m} &middot; ${t.p.toFixed(0)}%</div></div>
   ${Object.entries(t.subjects).map(([k,v])=>`<div class="sr"><span class="sn" style="color:${COL[k]||'#a78bfa'}">${k}</span><span class="bar"><i style="width:${Math.max(v.score/v.max*100,2)}%;background:${COL[k]||'#a78bfa'}"></i></span><span class="sv">${v.score}/${v.max}</span></div>`).join("")}</div>`).join("");
  app.innerHTML=h;
}
</script>
</body>
</html>
