<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Rail & Coaching Revision Drawer Integration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0a07;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* 1. MIDNIGHT RAIL (58px) */
    .ak-sidebar-rail {
      width: 58px;
      background: #120e0a;
      border-right: 1px solid rgba(245, 158, 11, 0.15);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
    }

    .ak-rail-avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      position: relative;
      margin-bottom: 8px;
    }
    .ak-rail-avatar .ak-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 9999px;
      position: absolute;
      top: -2px;
      right: -2px;
      border: 2px solid #120e0a;
    }
    .ak-rail-avatar .ak-level-badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: #000;
      color: #cbd5e1;
      font-size: 8px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    .ak-live-pill {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 1px 6px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }

    .ak-rail-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.15s ease;
      position: relative;
    }
    .ak-rail-icon-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }

    /* Active Highlighted Revision Button (Matches Screenshot) */
    .ak-rail-revision-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.2);
    }
    .ak-rail-rev-box {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.45);
      position: relative;
    }
    .ak-rail-rev-box .ak-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 12px;
      height: 12px;
      background: #f59e0b;
      color: #000;
      font-size: 8px;
      font-weight: 800;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 6px #f59e0b;
    }

    .ak-rail-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .ak-flame-streak {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      color: #f59e0b;
    }

    /* 2. SLIDEOUT REVISION DRAWER */
    .ak-slideout-drawer {
      position: fixed;
      top: 0;
      left: 58px;
      width: 360px;
      height: 100vh;
      background: #140e0a;
      border-right: 1px solid rgba(245, 158, 11, 0.2);
      box-shadow: 12px 0 36px rgba(0, 0, 0, 0.7);
      z-index: 999;
      transform: translateX(0);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
      padding: 20px;
      box-sizing: border-box;
    }
    .ak-slideout-drawer.closed {
      transform: translateX(-100%);
    }

    /* Main Demo Content Canvas */
    .ak-main-canvas {
      margin-left: 430px;
      padding: 40px;
      max-width: 800px;
      transition: margin-left 0.25s;
    }
    .ak-main-canvas.drawer-closed {
      margin-left: 80px;
    }
  </style>
</head>
<body>

  <!-- 1. LEFT RAIL -->
  <aside class="ak-sidebar-rail">
    <div class="ak-rail-avatar">
      P
      <div class="ak-dot"></div>
      <div class="ak-level-badge">20</div>
    </div>
    <div class="ak-live-pill">&bull; LIVE</div>

    <button class="ak-rail-icon-btn" title="Daily Tasks">📋</button>
    <button class="ak-rail-icon-btn" title="Calendar">📅</button>
    <button class="ak-rail-icon-btn" title="Timer">⏳</button>

    <!-- Revision Button -->
    <button class="ak-rail-revision-btn" id="btnToggleRevDrawer" onclick="window.akToggleDrawer()" title="Coaching Lecture Revision">
      <div class="ak-rail-rev-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
        <span class="ak-badge">!</span>
      </div>
    </button>

    <div class="ak-rail-bottom">
      <div style="font-size:10px; opacity:0.6;">🦊 FOX</div>
      <div class="ak-flame-streak">
        <span>🔥</span>
        <span>14d</span>
      </div>
    </div>
  </aside>

  <!-- 2. REVISION DRAWER (Self-Contained) -->
  <div class="ak-slideout-drawer" id="akSlideoutDrawer">
    <!-- Embedded coaching revision component -->
    <iframe src="coaching_revision_widget.html" style="width:100%; height:100%; border:none; background:transparent;"></iframe>
  </div>

  <!-- 3. DEMO CONTENT -->
  <main class="ak-main-canvas" id="akMainCanvas">
    <h1 style="color:#fbbf24; font-size:24px; margin-bottom:12px;">Coaching Lecture Revision Sidebar Integration</h1>
    <p style="color:#94a3b8; line-height:1.6; margin-bottom:24px;">
      Click the blue <strong>🔄</strong> icon in the sidebar to toggle the Coaching Revision Drawer open and closed. 
      This layout replicates your production workspace with 100% fidelity.
    </p>

    <button onclick="window.akToggleDrawer()" style="padding:10px 18px; border-radius:10px; background:#f59e0b; color:#000; font-weight:700; border:none; cursor:pointer;">
      Toggle Revision Drawer
    </button>
  </main>

  <script>
    window.akToggleDrawer = function() {
      const drawer = document.getElementById('akSlideoutDrawer');
      const canvas = document.getElementById('akMainCanvas');
      if (drawer) {
        drawer.classList.toggle('closed');
        if (canvas) {
          canvas.classList.toggle('drawer-closed', drawer.classList.contains('closed'));
        }
      }
    };
  </script>
</body>
</html>
