<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combine - Compare Tests</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: #f2f5f3; padding: 24px 20px 80px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .home-pill{display:inline-flex;background:#1a2420;border:1px solid #2a3a33;color:#f2f5f3;
    font-size:12.5px;padding:7px 12px;border-radius:20px;text-decoration:none;align-items:center;gap:5px;margin-bottom:14px;}
  .eyebrow { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #a78bfa; margin: 0 0 6px; opacity:0; animation: fadeInUp 0.5s ease forwards; }
  h1 { font-size: 24px; margin: 0 0 4px; font-weight: 700; opacity:0; animation: fadeInUp 0.5s ease 0.05s forwards; }
  .sub { color: #949494; font-size: 13.5px; margin: 0 0 22px; opacity:0; animation: fadeInUp 0.5s ease 0.1s forwards; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .head-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; margin-bottom: 22px; }
  @media (max-width: 560px) { .head-row { grid-template-columns: 1fr; } .vs-mark { display: none; } }
  .test-card { background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; padding: 18px 20px; opacity:0; animation: fadeInUp 0.5s ease forwards; position: relative; overflow: hidden; }
  .test-card.current { border-color: #7c5cf9; box-shadow: 0 0 0 1px #7c5cf933, 0 8px 24px -12px #7c5cf955; }
  .test-card.current::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #7c5cf9, #a78bfa); }
  .test-label { font-family: 'Courier New', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: #7a7a7a; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .test-label .dot { width: 6px; height: 6px; border-radius: 50%; background: #4a4a4a; }
  .test-card.current .test-label .dot { background: #a78bfa; }
  .test-score { font-size: 30px; font-weight: 700; font-family: 'Courier New', monospace; margin: 0; letter-spacing: -0.5px; }
  .test-score small { font-size: 13px; color: #7a7a7a; font-weight: 400; }
  .test-acc { font-size: 12.5px; color: #8a8a8a; margin-top: 10px; }
  .vs-mark { width: 34px; height: 34px; border-radius: 50%; background: #141414; border: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; color: #6b6b6b; font-size: 11px; font-weight: 700; }

  .delta-pill { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 700; font-family: 'Courier New', monospace; padding: 1px 8px; border-radius: 20px; margin-left: 8px; vertical-align: middle; }
  .delta-pill.up { color: #6fcf97; background: #6fcf9718; }
  .delta-pill.down { color: #e2665c; background: #e2665c18; }
  .delta-pill.flat { color: #8a8a8a; background: #8a8a8a18; }

  .section-label { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #a78bfa; border-bottom: 1px solid #2a2a2a; padding-bottom: 6px; margin: 30px 0 16px; }
  .chart-card { background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px 20px 6px; }

  .cmp-row { display: grid; grid-template-columns: 92px 1fr 56px; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #1e1e1e; }
  .cmp-row:last-child { border-bottom: none; }
  .cmp-subj { font-family: 'Courier New', monospace; font-size: 13px; }
  .cmp-subj .star { color: #d8a24a; }
  .cmp-bars { display: flex; flex-direction: column; gap: 6px; }
  .cmp-bar-line { display: flex; align-items: center; gap: 8px; }
  .cmp-bar-track { flex: 1; height: 16px; background: #1e1e1e; border-radius: 5px; overflow: hidden; }
  .cmp-bar-fill { height: 100%; border-radius: 5px; width: 0; transition: width 1s cubic-bezier(.2,.7,.3,1); }
  .cmp-bar-fill.prev { opacity: 0.38; }
  .cmp-bar-val { width: 44px; text-align: right; font-family: 'Courier New', monospace; font-size: 11px; color: #7a7a7a; flex-shrink: 0; }
  .cmp-delta { text-align: right; font-family: 'Courier New', monospace; font-size: 15px; font-weight: 700; }
  .cmp-delta.up { color: #6fcf97; }
  .cmp-delta.down { color: #e2665c; }
  .cmp-delta.flat { color: #6b6b6b; }
  .cmp-delta .arrow { font-size: 12px; }

  .legend { display: flex; gap: 20px; margin-bottom: 6px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-family: 'Courier New', monospace; font-size: 11.5px; color: #9a9a9a; }
  .legend-swatch { width: 14px; height: 8px; border-radius: 3px; flex-shrink: 0; }
  .legend-swatch.prev { opacity: 0.38; background: #6b6b6b; }
  .legend-swatch.cur { background: #a78bfa; }

  .summary-strip { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .summary-chip { flex: 1; min-width: 140px; background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; padding: 12px 14px; opacity:0; animation: fadeInUp 0.5s ease forwards; }
  .summary-chip .l { font-size: 10.5px; color: #7a7a7a; text-transform: uppercase; letter-spacing: 0.06em; font-family: 'Courier New', monospace; margin: 0 0 4px; }
  .summary-chip .v { font-size: 15px; font-weight: 700; }

  .note { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: #d8a24a; background: #2b1a0f; border: 1px solid #ffb84d33; border-radius: 10px; padding: 10px 12px; margin: 16px 0 20px; line-height: 1.5; }
  .footer-note { margin-top: 30px; font-size: 12px; color: #56685f; text-align: center; }
</style>
</head>
<body>
<a href="../../dashboard.html" class="home-pill">&#8592; Home</a>
<div class="wrap">
  <p class="eyebrow">Combine &middot; Compare tests</p>
  <h1>Last test vs this one</h1>
  <p class="sub">Side-by-side comparison of your two most recent combine tests.</p>

  <div class="head-row" id="headRow"></div>

  <div class="summary-strip" id="summaryStrip"></div>

  <div class="section-label">Subject-by-subject change</div>
  <div class="chart-card">
    <div class="legend" id="cmpLegend"></div>
    <div id="cmpRows"></div>
  </div>
  <div class="note" id="cmpNote" style="display:none;"></div>

  <p class="footer-note">Live &middot; Cognition Test Tracker &middot; Combine</p>
</div>

<script>
  const DATA = [
    {date: "2026-08-08", label: "08 Aug", score: 143, maxScore: 300, accuracy: 62.5, correct: 40, wrong: 24, skipped: 11,
     subjects: {
       physics: {score: 57, maxScore: 100, correct: 16, wrong: 9, skipped: 0},
       chemistry: {score: 61, maxScore: 100, correct: 17, wrong: 8, skipped: 0},
       maths: {score: 25, maxScore: 100, correct: 7, wrong: 7, skipped: 11}
     }},
    {date: "2026-08-23", label: "23 Aug", score: 95, maxScore: 300, accuracy: 56.0, correct: 28, wrong: 22, skipped: 25,
     subjects: {
       physics: {score: 33, maxScore: 100, correct: 10, wrong: 10, skipped: 5},
       chemistry: {score: 54, maxScore: 100, correct: 15, wrong: 8, skipped: 2},
       maths: {score: 8, maxScore: 100, correct: 3, wrong: 4, skipped: 18}
     }},
    {date: "2026-09-12", label: "12 Sep", score: 146, maxScore: 300, accuracy: 85.7, correct: 12, wrong: 2, skipped: 11, partialData: true,
     subjects: {
       physics: {score: 29, maxScore: 100, estimated: true},
       chemistry: {score: 71, maxScore: 100, estimated: true},
       maths: {score: 46, maxScore: 100, correct: 12, wrong: 2, skipped: 11}
     }}
  ];

  const current = DATA[DATA.length - 1];
  const prev = DATA[DATA.length - 2];
  const subjColors = { physics: '#6fcf97', chemistry: '#3b9dff', maths: '#ef8b7c' };
  const subjLabels = { physics: 'Physics', chemistry: 'Chemistry', maths: 'Maths' };

  const scoreDelta = current.score - prev.score;
  const scoreDeltaStr = (scoreDelta > 0 ? '+' : '') + scoreDelta;
  const scoreDeltaClass = scoreDelta > 0 ? 'up' : (scoreDelta < 0 ? 'down' : 'flat');

  document.getElementById('headRow').innerHTML = `
    <div class="test-card" style="animation-delay:0.05s;">
      <p class="test-label"><span class="dot"></span>Last &middot; ${prev.label} '26</p>
      <p class="test-score">${prev.score}<small> / ${prev.maxScore}</small></p>
      <p class="test-acc">${prev.accuracy.toFixed(1)}% accuracy</p>
    </div>
    <div class="vs-mark">VS</div>
    <div class="test-card current" style="animation-delay:0.1s;">
      <p class="test-label"><span class="dot"></span>This test &middot; ${current.label} '26</p>
      <p class="test-score">${current.score}<small> / ${current.maxScore}</small><span class="delta-pill ${scoreDeltaClass}">${scoreDeltaStr}</span></p>
      <p class="test-acc">${current.accuracy.toFixed(1)}% accuracy${current.partialData ? ' *' : ''}</p>
    </div>
  `;

  document.getElementById('cmpLegend').innerHTML = `
    <div class="legend-item"><span class="legend-swatch prev"></span>Last test</div>
    <div class="legend-item"><span class="legend-swatch cur"></span>This test</div>
  `;

  const rowsEl = document.getElementById('cmpRows');
  let hasEstimated = false;
  let improved = 0, declined = 0, biggestKey = null, biggestVal = -Infinity;
  Object.keys(current.subjects).forEach(key => {
    const c = current.subjects[key];
    const p = prev.subjects[key];
    const delta = c.score - p.score;
    if (delta > 0) improved++; else if (delta < 0) declined++;
    if (delta > biggestVal) { biggestVal = delta; biggestKey = key; }
    const deltaStr = (delta > 0 ? '+' : '') + delta;
    const deltaClass = delta > 0 ? 'up' : (delta < 0 ? 'down' : 'flat');
    const arrow = delta > 0 ? '&#9650;' : (delta < 0 ? '&#9660;' : '&#8212;');
    if (c.estimated) hasEstimated = true;
    const row = document.createElement('div');
    row.className = 'cmp-row';
    row.innerHTML = `
      <div class="cmp-subj">${subjLabels[key]}${c.estimated ? ' <span class="star">*</span>' : ''}</div>
      <div class="cmp-bars">
        <div class="cmp-bar-line"><div class="cmp-bar-track"><div class="cmp-bar-fill prev" style="background:${subjColors[key]};" data-w="${p.score}"></div></div><div class="cmp-bar-val">${p.score}/${p.maxScore}</div></div>
        <div class="cmp-bar-line"><div class="cmp-bar-track"><div class="cmp-bar-fill" style="background:${subjColors[key]};" data-w="${c.score}"></div></div><div class="cmp-bar-val">${c.score}/${c.maxScore}</div></div>
      </div>
      <div class="cmp-delta ${deltaClass}"><span class="arrow">${arrow}</span> ${Math.abs(delta)}</div>
    `;
    rowsEl.appendChild(row);
  });
  setTimeout(() => {
    document.querySelectorAll('.cmp-bar-fill').forEach(el => { el.style.width = el.getAttribute('data-w') + '%'; });
  }, 300);

  document.getElementById('summaryStrip').innerHTML = `
    <div class="summary-chip" style="animation-delay:0.15s;">
      <p class="l">Improved in</p>
      <p class="v" style="color:#6fcf97;">${improved} of 3 subjects</p>
    </div>
    <div class="summary-chip" style="animation-delay:0.2s;">
      <p class="l">Biggest gain</p>
      <p class="v" style="color:${subjColors[biggestKey]};">${subjLabels[biggestKey]} ${biggestVal >= 0 ? '+' : ''}${biggestVal}</p>
    </div>
    <div class="summary-chip" style="animation-delay:0.25s;">
      <p class="l">Overall change</p>
      <p class="v" style="color:${scoreDelta >= 0 ? '#6fcf97' : '#e2665c'};">${scoreDeltaStr} pts</p>
    </div>
  `;

  if (hasEstimated) {
    const noteEl = document.getElementById('cmpNote');
    noteEl.style.display = 'flex';
    noteEl.innerHTML = '&#9888;&nbsp;<span>Subjects marked with <b>*</b> are user-reported totals for this test, not scored question-by-question.</span>';
  }
</script>
</body>
</html>
