<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture Revision Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #06090e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 16px;
    }

    /* Top Download & Action Toolbar */
    .download-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      background: #111827;
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .download-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 800;
      font-size: 12px;
      border: none;
      padding: 7px 14px;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .download-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .copy-btn {
      background: #1f2937;
      color: #cbd5e1;
      font-weight: 700;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 7px 14px;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .copy-btn:hover {
      background: #374151;
      color: #fff;
    }

    /* ========================================================================
       EXACT SCREENSHOT-MATCHING LECTURE REVISION DRAWER / COMPONENT
       ======================================================================== */
    .rev-container {
      width: 100%;
      max-width: 380px;
      background: #0c1017;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px 20px 20px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      user-select: none;
      position: relative;
    }

    /* 1. Header */
    .rev-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .rev-eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #7b8b9e;
      margin-bottom: 4px;
    }
    .rev-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .rev-close-icon {
      background: none;
      border: none;
      color: #64748b;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
      transition: color 0.15s;
    }
    .rev-close-icon:hover {
      color: #ffffff;
    }

    /* 2. Today's Target Card */
    .rev-card {
      background: #111622;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .rev-dial-wrap {
      width: 58px;
      height: 58px;
      position: relative;
      flex-shrink: 0;
    }
    .rev-dial-svg {
      width: 58px;
      height: 58px;
      transform: rotate(-90deg);
    }
    .rev-dial-arc {
      transition: stroke-dashoffset 0.4s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.3s;
    }
    .rev-dial-pct {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, monospace;
    }

    .rev-card-info {
      flex: 1;
      min-width: 0;
    }
    .rev-target-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .rev-target-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #ffffff;
    }
    .rev-ratio-text {
      font-size: 13px;
      font-weight: 800;
      color: #f59e0b;
      font-family: monospace;
      letter-spacing: 0.02em;
    }
    .rev-submsg {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .rev-status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 700;
    }
    .rev-active-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #f59e0b;
    }
    .rev-active-dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: #f59e0b;
      box-shadow: 0 0 6px #f59e0b;
    }
    .rev-target-tag {
      color: #64748b;
    }

    /* 3. Section Head (Ongoing Class Lectures) */
    .rev-sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 2px;
    }
    .rev-sec-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7b8b9e;
    }
    .rev-update-btn {
      background: none;
      border: none;
      color: #f59e0b;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.15s;
      padding: 0;
    }
    .rev-update-btn:hover {
      color: #fbbf24;
    }

    /* 4. Lectures List */
    .rev-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 26px;
    }
    .rev-item-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .rev-item-left {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    /* Custom Round Circle Checkbox */
    .rev-round-check {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #334155;
      border-radius: 9999px;
      outline: none;
      cursor: pointer;
      display: grid;
      place-content: center;
      margin-top: 1px;
      flex-shrink: 0;
      background: transparent;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .rev-round-check:checked {
      background-color: #f59e0b;
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    .rev-round-check:checked::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #0c1017;
      border-radius: 9999px;
    }

    .rev-text-wrap {
      flex: 1;
      min-width: 0;
    }
    .rev-name {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s;
    }
    .rev-round-check:checked ~ .rev-text-wrap .rev-name {
      text-decoration: line-through;
      color: #64748b;
    }
    .rev-desc {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
      line-height: 1.35;
    }
    .rev-round-check:checked ~ .rev-text-wrap .rev-desc {
      opacity: 0.6;
    }

    .rev-item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .rev-subj-tag {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .subj-phy { color: #38bdf8; }
    .subj-chem { color: #34d399; }
    .subj-math { color: #c084fc; }

    .rev-del-btn {
      background: none;
      border: none;
      color: #475569;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .rev-item-row:hover .rev-del-btn {
      opacity: 1;
    }
    .rev-del-btn:hover {
      color: #f43f5e;
    }

    /* 5. Bottom Sticky CTA Button */
    .rev-cta-btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #000000;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      transition: transform 0.15s, opacity 0.15s;
    }
    .rev-cta-btn:hover {
      opacity: 0.96;
      transform: translateY(-1px);
    }
    .rev-cta-btn:active {
      transform: translateY(0);
    }

    /* Inline Add / Update Modal */
    .rev-dialog {
      display: none;
      background: #141a29;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
    }
    .rev-dialog-subs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .rev-sub-pill {
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #334155;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      background: #0d121d;
      color: #94a3b8;
    }
    .rev-sub-pill.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }
    .rev-input-field {
      width: 100%;
      background: #090d15;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
      margin-bottom: 8px;
    }
    .rev-input-field:focus {
      border-color: #f59e0b;
    }
  </style>
</head>
<body>

  <!-- Top Action Bar for User Convenience -->
  <div class="download-bar">
    <button class="download-btn" onclick="downloadWidgetFile()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
      </svg>
      Download HTML File
    </button>
    <button class="copy-btn" onclick="copyWidgetCode(this)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      Copy Code
    </button>
  </div>

  <!-- EXACT MATCHING WIDGET -->
  <div class="rev-container" id="coaching-revision-widget">
    <!-- 1. Header -->
    <div class="rev-head">
      <div>
        <div class="rev-eyebrow">EVENING DESK &bull; 6:30 PM</div>
        <div class="rev-title">Lecture Revision</div>
      </div>
      <button class="rev-close-icon" onclick="window.akCloseWidget()" title="Close">&times;</button>
    </div>

    <!-- 2. Today's Target Card -->
    <div class="rev-card">
      <div class="rev-dial-wrap">
        <svg class="rev-dial-svg" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="26" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4.5" fill="none" />
          <circle id="revDialArc" class="rev-dial-arc" cx="32" cy="32" r="26" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" fill="none"
                  stroke-dasharray="163.36" stroke-dashoffset="163.36" />
        </svg>
        <div class="rev-dial-pct" id="revDialPct">0%</div>
      </div>

      <div class="rev-card-info">
        <div class="rev-target-row">
          <span class="rev-target-title">Today's Target</span>
          <span class="rev-ratio-text" id="revRatioText">0 / 3 Done</span>
        </div>
        <div class="rev-submsg" id="revSubMsg">3 lectures left to revise before question practice</div>
        <div class="rev-status-line">
          <span class="rev-active-pill">
            <span class="rev-active-dot"></span>
            Active
          </span>
          <span class="rev-target-tag">&bull; Target: 99%ile</span>
        </div>
      </div>
    </div>

    <!-- Inline Add / Update Dialog -->
    <div class="rev-dialog" id="revAddDialog">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:11.5px; font-weight:800; color:#fbbf24;">Add / Update Class Lecture</span>
        <button onclick="window.akToggleAddForm()" style="background:none; border:none; color:#94a3b8; font-size:15px; cursor:pointer;">&times;</button>
      </div>

      <div class="rev-dialog-subs">
        <button type="button" class="rev-sub-pill active" onclick="window.akSelectSub('Physics', this)">Physics</button>
        <button type="button" class="rev-sub-pill" onclick="window.akSelectSub('Chemistry', this)">Chemistry</button>
        <button type="button" class="rev-sub-pill" onclick="window.akSelectSub('Maths', this)">Maths</button>
      </div>

      <input type="text" id="revInputName" class="rev-input-field" placeholder="Topic / Chapter (e.g. Center of Mass, GOC...)">
      <input type="text" id="revInputDesc" class="rev-input-field" placeholder="Revision Note (e.g. Revise notes & class illustrations)">

      <div style="display:flex; gap:6px; margin-top:2px;">
        <button onclick="window.akToggleAddForm()" style="flex:1; background:#1e293b; color:#94a3b8; border:none; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; padding:7px;">Cancel</button>
        <button onclick="window.akSaveLecture()" style="flex:2; background:#f59e0b; color:#000; border:none; border-radius:8px; font-size:11px; font-weight:800; cursor:pointer; padding:7px;">Save Topic</button>
      </div>
    </div>

    <!-- 3. Section Head -->
    <div class="rev-sec-head">
      <span class="rev-sec-title">ONGOING CLASS LECTURES</span>
      <button class="rev-update-btn" onclick="window.akToggleAddForm()">+ Update</button>
    </div>

    <!-- 4. Lectures List -->
    <div class="rev-list" id="revList">
      <!-- Populated via JavaScript -->
    </div>

    <!-- 5. Bottom Sticky CTA Button -->
    <button class="rev-cta-btn" onclick="window.akToggleAddForm()">
      + Add Topic For Revision
    </button>
  </div>

  <script>
    const STORAGE_KEY = 'akiva_coaching_revision_v1';
    const CIRCUMFERENCE = 2 * Math.PI * 26; // 163.36
    let selectedSub = 'Physics';

    // Exact topics from user screenshot
    const DEFAULT_LECTURES = [
      { id: 'rev_1', title: 'Rotational Motion', subject: 'Physics', desc: 'Revise notes & class illustrations', done: false },
      { id: 'rev_2', title: 'Ionic Equilibrium', subject: 'Chemistry', desc: 'Buffer solutions & Hydrolysis formulas', done: false },
      { id: 'rev_3', title: 'Definite Integration', subject: 'Maths', desc: 'Properties 1 to 4 formulas review', done: false }
    ];

    function loadLectures() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : DEFAULT_LECTURES;
      } catch(e) {
        return DEFAULT_LECTURES;
      }
    }

    function saveLectures(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch(e) {}
    }

    let lectures = loadLectures();

    function render() {
      const container = document.getElementById('revList');
      if (!container) return;
      container.innerHTML = '';

      const total = lectures.length;
      const done = lectures.filter(l => l.done).length;
      const left = total - done;
      const pct = total ? Math.round((done / total) * 100) : 0;

      // Update circular dial
      const arc = document.getElementById('revDialArc');
      if (arc) {
        arc.style.strokeDashoffset = CIRCUMFERENCE - (CIRCUMFERENCE * pct / 100);
        arc.style.stroke = pct === 100 ? '#10b981' : '#f59e0b';
      }

      const pctEl = document.getElementById('revDialPct');
      if (pctEl) pctEl.textContent = `${pct}%`;

      const ratioEl = document.getElementById('revRatioText');
      if (ratioEl) ratioEl.textContent = `${done} / ${total} Done`;

      const subMsgEl = document.getElementById('revSubMsg');
      if (subMsgEl) {
        if (left === 0 && total > 0) {
          subMsgEl.innerHTML = '<span style="color:#34d399; font-weight:700;">All lectures revised! Ready for questions ⚡</span>';
        } else {
          subMsgEl.textContent = `${left} lecture${left > 1 ? 's' : ''} left to revise before question practice`;
        }
      }

      if (total === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:24px 0; color:#64748b; font-size:12px;">
            No ongoing coaching lectures. Click "+ Add Topic" below!
          </div>
        `;
        return;
      }

      lectures.forEach(l => {
        let subjClass = 'subj-phy';
        if (l.subject === 'Chemistry') subjClass = 'subj-chem';
        else if (l.subject === 'Maths' || l.subject === 'Math') subjClass = 'subj-math';

        const row = document.createElement('div');
        row.className = 'rev-item-row';
        row.innerHTML = `
          <label class="rev-item-left">
            <input type="checkbox" class="rev-round-check" ${l.done ? 'checked' : ''} onchange="window.akToggleDone('${l.id}')">
            <div class="rev-text-wrap">
              <div class="rev-name" title="${l.title}">${l.title}</div>
              <div class="rev-desc">${l.desc || 'Revise notes & class illustrations'}</div>
            </div>
          </label>
          <div class="rev-item-right">
            <span class="rev-subj-tag ${subjClass}">${l.subject}</span>
            <button class="rev-del-btn" onclick="window.akDeleteLecture('${l.id}')" title="Delete">&times;</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    window.akToggleDone = function(id) {
      const item = lectures.find(x => x.id === id);
      if (item) {
        item.done = !item.done;
        saveLectures(lectures);
        render();
      }
    };

    window.akDeleteLecture = function(id) {
      lectures = lectures.filter(x => x.id !== id);
      saveLectures(lectures);
      render();
    };

    window.akToggleAddForm = function() {
      const d = document.getElementById('revAddDialog');
      if (!d) return;
      const isHidden = d.style.display === 'none' || !d.style.display;
      d.style.display = isHidden ? 'block' : 'none';
      if (isHidden) {
        const inp = document.getElementById('revInputName');
        if (inp) { inp.value = ''; inp.focus(); }
      }
    };

    window.akSelectSub = function(sub, btn) {
      selectedSub = sub;
      document.querySelectorAll('.rev-sub-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };

    window.akSaveLecture = function() {
      const nameIn = document.getElementById('revInputName');
      const descIn = document.getElementById('revInputDesc');
      const title = nameIn ? nameIn.value.trim() : '';
      const desc = descIn ? descIn.value.trim() : '';

      if (!title) return;

      lectures.push({
        id: 'rev_' + Date.now(),
        title: title,
        subject: selectedSub,
        desc: desc || 'Revise notes & class illustrations',
        done: false
      });

      saveLectures(lectures);
      window.akToggleAddForm();
      render();
    };

    window.akCloseWidget = function() {
      const el = document.getElementById('coaching-revision-widget');
      if (el) el.style.display = 'none';
    };

    // Download Handler
    function downloadWidgetFile() {
      const fullHtml = document.documentElement.outerHTML;
      const blob = new Blob([fullHtml], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'coaching_revision.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Copy Code Handler
    function copyWidgetCode(btn) {
      const fullHtml = document.documentElement.outerHTML;
      navigator.clipboard.writeText(fullHtml).then(() => {
        const oldText = btn.innerHTML;
        btn.innerHTML = '<span>✅ Copied!</span>';
        setTimeout(() => { btn.innerHTML = oldText; }, 2000);
      }).catch(err => {
        alert('Could not copy automatically. You can download the file directly!');
      });
    }

    render();
  </script>
</body>
</html>
