<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TESTS</title>
<style>
  :root {
    --paper: #101613; --card: #1a2420; --card-border: #2a3a33;
    --teal: #2bb3a0; --text: #f2f5f3; --muted: #8fa79d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 20% -10%, #1c332c 0%, var(--paper) 55%);
    color: var(--text);
    min-height: 100vh; min-height: 100dvh;
    padding: 24px 16px 32px;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { max-width: 420px; width: 100%; }
  .logo-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
  .logo-wrap img { width: 64px; height: 64px; filter: drop-shadow(0 0 14px #2bb3a055); }
  .eyebrow { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--teal); margin: 0 0 6px; text-align: center; }
  h1 { font-size: clamp(19px, 5.5vw, 22px); margin: 0 0 4px; font-weight: 700; text-align: center; }
  p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; text-align: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  a.card {
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    min-height: 88px; padding: 14px; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; color: var(--text); font-size: 15px; font-weight: 600;
    text-decoration: none; transition: transform 0.12s, border-color 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  a.card:active { transform: scale(0.97); }
  a.card .icon { font-size: 20px; margin-bottom: 6px; }
  .footer-note { margin-top: 26px; font-size: 11.5px; color: #56685f; text-align: center; }

  @media (max-width: 380px) {
    .grid { gap: 10px; }
    a.card { min-height: 80px; padding: 12px; font-size: 14px; }
  }
</style>
</head>
