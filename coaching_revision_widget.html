<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coaching Lecture Revision Widget</title>
  <style>
    /* Reset & Demo Backdrop */
    body {
      margin: 0;
      padding: 24px;
      background: #0a0806;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<!-- ==============================================================================
     COACHING LECTURE REVISION DRAWER / WIDGET
     - Matches 100% with Night Desk / Revision Drawer UI Screenshot
     - Pure Vanilla HTML5, CSS3, & ES6 JS (Zero external dependencies)
     - Self-contained, scoped CSS (.rev-drawer-* / .rev-*)
     - Auto-persists in localStorage ('akiva_coaching_revision_v1')
     - Can be used as a Slideout Drawer or Embedded Card
     ============================================================================== -->

<div id="revision-drawer-root" class="rev-drawer-container">
  <style>
    /* Scoped Styles for Revision Drawer */
    .rev-drawer-container {
      width: 100%;
      max-width: 380px;
      background: #140e0a;
      border: 1px solid rgba(245, 158, 11, 0.18);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8), 0 0 24px rgba(245, 158, 11, 0.05);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      box-sizing: border-box;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }
    .rev-drawer-container * {
      box-sizing: border-box;
    }

    /* 1. Header */
    .rev-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .rev-header-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #d97706;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rev-header-title span.rev-time {
      color: #94a3b8;
      font-weight: 600;
    }
    .rev-close-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: all 0.15s ease;
    }
    .rev-close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    /* 2. Today's Progress Card */
    .rev-progress-card {
      background: #1a120c;
      border: 1px solid rgba(245, 158, 11, 0.16);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .rev-card-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
    }
    .rev-card-subtitle {
      font-size: 10.5px;
      color: #94a3b8;
      margin-bottom: 14px;
    }
    .rev-stats-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    /* Circular Gauge */
    .rev-dial-box {
      width: 54px;
      height: 54px;
      position: relative;
      flex-shrink: 0;
    }
    .rev-dial-svg {
      width: 54px;
      height: 54px;
      transform: rotate(-90deg);
    }
    .rev-dial-circle {
      transition: stroke-dashoffset 0.4s ease;
    }
    .rev-dial-pct {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: #f59e0b;
      font-family: monospace;
    }

    /* Stat Badges */
    .rev-stat-badge {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .rev-stat-planned {
      background: #151a28;
      border: 1px solid rgba(59, 130, 246, 0.25);
    }
    .rev-stat-completed {
      background: #112318;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }
    .rev-stat-num {
      font-size: 18px;
      font-weight: 800;
      font-family: monospace;
      line-height: 1.1;
    }
    .rev-stat-planned .rev-stat-num { color: #60a5fa; }
    .rev-stat-completed .rev-stat-num { color: #4ade80; }
    .rev-stat-lbl {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
      margin-top: 2px;
    }

    /* 3. Segmented Tabs (Today's Task / Completed Tasks) */
    .rev-tabs {
      display: flex;
      gap: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 14px;
      padding-bottom: 6px;
    }
    .rev-tab-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 2px;
      position: relative;
      transition: color 0.15s;
    }
    .rev-tab-btn:hover {
      color: #cbd5e1;
    }
    .rev-tab-btn.active {
      color: #f59e0b;
    }
    .rev-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 0;
      right: 0;
      height: 2px;
      background: #f59e0b;
      border-radius: 9999px;
    }

    /* 4. Subject Filter Pills */
    .rev-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .rev-filters::-webkit-scrollbar { display: none; }
    .rev-pill {
      background: #1a130e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .rev-pill:hover {
      border-color: rgba(245, 158, 11, 0.4);
      color: #ffffff;
    }
    .rev-pill.active {
      background: rgba(245, 158, 11, 0.15);
      border-color: #f59e0b;
      color: #fbbf24;
      font-weight: 700;
    }

    /* 5. Tasks / Lectures List */
    .rev-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 140px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 2px;
      margin-bottom: 16px;
    }
    .rev-list::-webkit-scrollbar {
      width: 4px;
    }
    .rev-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .rev-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 10px;
      text-align: center;
      color: #64748b;
      font-size: 11px;
      line-height: 1.5;
    }

    .rev-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #1c140e;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.15s;
    }
    .rev-item:hover {
      background: #241a13;
    }
    .rev-item.done {
      opacity: 0.55;
    }

    /* Round Checkbox */
    .rev-check {
      appearance: none;
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      outline: none;
      cursor: pointer;
      display: grid;
      place-content: center;
      margin-top: 2px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .rev-check:checked {
      background-color: #f59e0b;
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }
    .rev-check:checked::before {
      content: "";
      width: 5px;
      height: 5px;
      background: #140e0a;
      border-radius: 9999px;
    }

    .rev-item-content {
      flex: 1;
      min-width: 0;
    }
    .rev-item-title {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rev-item.done .rev-item-title {
      text-decoration: line-through;
      color: #64748b;
    }
    .rev-item-desc {
      font-size: 9.5px;
      color: #94a3b8;
      margin-top: 2px;
      line-height: 1.35;
    }

    /* Badges */
    .rev-badge {
      font-size: 9px;
      font-family: monospace;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .badge-phy { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-chem { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge-math { background: rgba(192, 132, 252, 0.15); color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.3); }

    .rev-del-btn {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      line-height: 1;
      opacity: 0.3;
      transition: opacity 0.15s, color 0.15s;
    }
    .rev-del-btn:hover {
      opacity: 1;
      color: #f43f5e;
    }

    /* 6. Sticky CTA Button */
    .rev-cta-btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35);
      transition: transform 0.1s, opacity 0.15s;
    }
    .rev-cta-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .rev-cta-btn:active {
      transform: translateY(0);
    }

    /* 7. Inline Quick Add Modal */
    .rev-modal {
      display: none;
      background: #1f1610;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }
    .rev-modal-subs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }
    .rev-sub-select-btn {
      padding: 6px;
      border-radius: 8px;
      border: none;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      background: #2a1f17;
      color: #94a3b8;
    }
    .rev-sub-select-btn.active {
      background: #f59e0b;
      color: #000;
    }
    .rev-input {
      width: 100%;
      background: #140e0a;
      border: 1px solid #3d2a1c;
      color: #fff;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 11px;
      outline: none;
      margin-bottom: 6px;
    }
    .rev-input:focus {
      border-color: #f59e0b;
    }
  </style>

  <!-- 1. Header -->
  <div class="rev-header">
    <div class="rev-header-title">
      <span>NIGHT DESK</span>
      <span>&bull;</span>
      <span class="rev-time" id="revTimeDisplay">11:46 PM</span>
    </div>
    <button class="rev-close-btn" onclick="window.akRevisionClose()" title="Close Drawer">&times;</button>
  </div>

  <!-- 2. Today's Progress Card -->
  <div class="rev-progress-card">
    <div class="rev-card-title">Today's Progress</div>
    <div class="rev-card-subtitle" id="revProgressSubtitle">All targets completed today! Excellent work.</div>
    <div class="rev-stats-row">
      <!-- Speedo Ring -->
      <div class="rev-dial-box">
        <svg class="rev-dial-svg" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="26" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4.5" fill="none" />
          <circle id="rev-dial-arc" class="rev-dial-circle" cx="32" cy="32" r="26" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" fill="none"
                  stroke-dasharray="163.36" stroke-dashoffset="163.36" />
        </svg>
        <div class="rev-dial-pct" id="revDialPct">0%</div>
      </div>

      <!-- Stat Badges (Planned & Completed) -->
      <div class="rev-stat-badge rev-stat-planned">
        <div class="rev-stat-num" id="revPlannedNum">0</div>
        <div class="rev-stat-lbl">PLANNED</div>
      </div>
      <div class="rev-stat-badge rev-stat-completed">
        <div class="rev-stat-num" id="revCompletedNum">0</div>
        <div class="rev-stat-lbl">COMPLETED</div>
      </div>
    </div>
  </div>

  <!-- 3. Segmented Tabs -->
  <div class="rev-tabs">
    <button class="rev-tab-btn active" id="tabTodayTasks" onclick="window.akRevSetTab('today')">Today's Task</button>
    <button class="rev-tab-btn" id="tabCompletedTasks" onclick="window.akRevSetTab('completed')">Completed Tasks</button>
  </div>

  <!-- 4. Subject Filter Pills -->
  <div class="rev-filters">
    <button class="rev-pill active" onclick="window.akRevSetFilter('All', this)">All</button>
    <button class="rev-pill" onclick="window.akRevSetFilter('Physics', this)">Physics</button>
    <button class="rev-pill" onclick="window.akRevSetFilter('Chemistry', this)">Chemistry</button>
    <button class="rev-pill" onclick="window.akRevSetFilter('Maths', this)">Maths</button>
  </div>

  <!-- 5. Tasks List -->
  <div class="rev-list" id="revListContainer">
    <!-- Populated dynamically via JS -->
  </div>

  <!-- 6. Sticky CTA Button -->
  <button class="rev-cta-btn" onclick="window.akRevToggleAddModal()">
    + Add Topic For Today
  </button>

  <!-- 7. Inline Quick Add Form Modal -->
  <div class="rev-modal" id="revAddModal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span style="font-size:11px; font-weight:700; color:#fbbf24;">Add Coaching Topic / Lecture</span>
      <button onclick="window.akRevToggleAddModal()" style="background:none; border:none; color:#94a3b8; font-size:14px; cursor:pointer;">&times;</button>
    </div>
    <div class="rev-modal-subs">
      <button type="button" class="rev-sub-select-btn active" id="revModalPhy" onclick="window.akRevSelectSub('Physics', this)">Physics</button>
      <button type="button" class="rev-sub-select-btn" id="revModalChem" onclick="window.akRevSelectSub('Chemistry', this)">Chemistry</button>
      <button type="button" class="rev-sub-select-btn" id="revModalMath" onclick="window.akRevSelectSub('Maths', this)">Maths</button>
    </div>
    <input type="text" id="revInTitle" class="rev-input" placeholder="Chapter name (e.g. Rotational Motion)">
    <input type="text" id="revInDesc" class="rev-input" placeholder="Revision note (e.g. Class notes & illustrations)">
    <div style="display:flex; gap:6px; margin-top:4px;">
      <button onclick="window.akRevToggleAddModal()" style="flex:1; background:#2a1f17; color:#94a3b8; border:none; border-radius:8px; font-size:10px; font-weight:700; cursor:pointer; padding:6px;">Cancel</button>
      <button onclick="window.akRevSaveTopic()" style="flex:2; background:#f59e0b; color:#000; border:none; border-radius:8px; font-size:10px; font-weight:800; cursor:pointer; padding:6px;">Save Topic</button>
    </div>
  </div>

  <!-- Component Logic -->
  <script>
  (function() {
    const STORAGE_KEY = 'akiva_coaching_revision_v1';
    const CIRCUMFERENCE = 2 * Math.PI * 26; // 163.36
    let activeTab = 'today';      // 'today' | 'completed'
    let activeFilter = 'All';      // 'All' | 'Physics' | 'Chemistry' | 'Maths'
    let selectedModalSub = 'Physics';

    // Sample initial data matching coaching lecture flow
    const DEFAULT_DATA = [
      { id: 'rev_1', title: 'Rotational Motion', subject: 'Physics', desc: 'Revise notes & class illustrations', done: true },
      { id: 'rev_2', title: 'Ionic Equilibrium', subject: 'Chemistry', desc: 'Buffer solutions & Hydrolysis formulas', done: true },
      { id: 'rev_3', title: 'Definite Integration', subject: 'Maths', desc: 'Properties 1 to 4 formulas review', done: true },
      { id: 'rev_4', title: 'Wave Optics', subject: 'Physics', desc: 'YDSE fringe width derivations', done: true }
    ];

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : DEFAULT_DATA;
      } catch(e) { return DEFAULT_DATA; }
    }

    function saveData(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
    }

    let items = loadData();

    function updateTime() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const el = document.getElementById('revTimeDisplay');
      if (el) el.textContent = `${hours}:${minutes} ${ampm}`;
    }
    updateTime();
    setInterval(updateTime, 30000);

    function render() {
      const container = document.getElementById('revListContainer');
      if (!container) return;
      container.innerHTML = '';

      const total = items.length;
      const completedCount = items.filter(x => x.done).length;
      const plannedCount = total - completedCount;
      const pct = total ? Math.round((completedCount / total) * 100) : 0;

      // Update Gauge Ring
      const arc = document.getElementById('rev-dial-arc');
      if (arc) {
        arc.style.strokeDashoffset = CIRCUMFERENCE - (CIRCUMFERENCE * pct / 100);
      }
      const pctEl = document.getElementById('revDialPct');
      if (pctEl) pctEl.textContent = `${pct}%`;

      // Update Planned & Completed Counts
      const plannedEl = document.getElementById('revPlannedNum');
      if (plannedEl) plannedEl.textContent = plannedCount;
      const compEl = document.getElementById('revCompletedNum');
      if (compEl) compEl.textContent = completedCount;

      // Subtitle
      const subEl = document.getElementById('revProgressSubtitle');
      if (subEl) {
        if (plannedCount === 0 && total > 0) {
          subEl.innerHTML = '<span style="color:#4ade80; font-weight:600;">All targets completed today! Excellent work.</span>';
        } else {
          subEl.textContent = `${plannedCount} task${plannedCount > 1 ? 's' : ''} left for today. Keep going!`;
        }
      }

      // Filter items according to active tab and subject filter
      let filtered = items.filter(item => {
        if (activeTab === 'today') return !item.done;
        if (activeTab === 'completed') return item.done;
        return true;
      });

      if (activeFilter !== 'All') {
        filtered = filtered.filter(item => item.subject === activeFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="rev-empty">
            <div style="font-size:22px; margin-bottom:6px;">✨</div>
            <div>No ${activeTab === 'today' ? 'pending' : 'completed'} tasks for today. Click "+ Add Topic" below!</div>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        let badgeClass = 'badge-phy';
        let subTag = 'Phy';
        if (item.subject === 'Chemistry') { badgeClass = 'badge-chem'; subTag = 'Chem'; }
        else if (item.subject === 'Maths' || item.subject === 'Math') { badgeClass = 'badge-math'; subTag = 'Math'; }

        const row = document.createElement('div');
        row.className = `rev-item ${item.done ? 'done' : ''}`;
        row.innerHTML = `
          <input type="checkbox" class="rev-check" ${item.done ? 'checked' : ''} onchange="window.akRevToggleItem('${item.id}')">
          <div class="rev-item-content">
            <div class="rev-item-title" title="${item.title}">${item.title}</div>
            <div class="rev-item-desc">${item.desc || 'Revise notes & class illustrations'}</div>
          </div>
          <span class="rev-badge ${badgeClass}">${subTag}</span>
          <button class="rev-del-btn" onclick="window.akRevDeleteItem('${item.id}')" title="Delete topic">&times;</button>
        `;
        container.appendChild(row);
      });
    }

    window.akRevSetTab = function(tab) {
      activeTab = tab;
      document.getElementById('tabTodayTasks')?.classList.toggle('active', tab === 'today');
      document.getElementById('tabCompletedTasks')?.classList.toggle('active', tab === 'completed');
      render();
    };

    window.akRevSetFilter = function(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.rev-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    };

    window.akRevToggleItem = function(id) {
      const item = items.find(x => x.id === id);
      if (item) {
        item.done = !item.done;
        saveData(items);
        render();
      }
    };

    window.akRevDeleteItem = function(id) {
      items = items.filter(x => x.id !== id);
      saveData(items);
      render();
    };

    window.akRevToggleAddModal = function() {
      const modal = document.getElementById('revAddModal');
      if (!modal) return;
      const isHidden = modal.style.display === 'none' || !modal.style.display;
      modal.style.display = isHidden ? 'block' : 'none';
      if (isHidden) {
        const inp = document.getElementById('revInTitle');
        if (inp) { inp.value = ''; inp.focus(); }
      }
    };

    window.akRevSelectSub = function(sub, btn) {
      selectedModalSub = sub;
      document.querySelectorAll('.rev-sub-select-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };

    window.akRevSaveTopic = function() {
      const titleIn = document.getElementById('revInTitle');
      const descIn = document.getElementById('revInDesc');
      const title = titleIn ? titleIn.value.trim() : '';
      const desc = descIn ? descIn.value.trim() : '';

      if (!title) return;

      items.unshift({
        id: 'rev_' + Date.now(),
        title: title,
        subject: selectedModalSub,
        desc: desc || 'Revise notes & class illustrations',
        done: false
      });

      saveData(items);
      window.akRevToggleAddModal();
      activeTab = 'today';
      document.getElementById('tabTodayTasks')?.classList.add('active');
      document.getElementById('tabCompletedTasks')?.classList.remove('active');
      render();
    };

    window.akRevisionClose = function() {
      const root = document.getElementById('revision-drawer-root');
      if (root) {
        root.style.display = 'none';
      }
    };

    render();
  })();
  </script>
</div>

</body>
</html>
